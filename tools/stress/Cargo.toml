[package]
name = "kiki-stress"
version = "0.1.0"
edition = "2021"
publish = false
description = "Out-of-process stress harness for `kiki serve`"

# Kept out of Kiki's own build: this is a standalone tool.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
