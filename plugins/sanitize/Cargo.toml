[package]
name = "kiki-sanitize"
version = "2.0.0"
edition = "2021"
publish = false
description = "Kiki's sanitize plugin, installed as plugins/sanitize/plugin.wasm"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
kiki-plugin = { path = "../../sdk/rust/kiki-plugin" }
lol_html = "2"
quick-xml = { version = "0.37", default-features = false, features = ["escape-html"] }
serde_json = "1"
