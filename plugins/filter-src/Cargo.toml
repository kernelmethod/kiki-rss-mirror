[package]
name = "kiki-filter"
version = "3.1.0"
edition = "2021"
publish = false
description = "Kiki's filter plugin, installed as plugins/filter/plugin.wasm"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
kiki-plugin = { path = "../../sdk/rust/kiki-plugin" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Not part of kiki-rss's workspace; kiki-rss's build.rs builds it for
# wasm32-unknown-unknown.
[workspace]
