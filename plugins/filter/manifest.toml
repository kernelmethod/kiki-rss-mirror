name = "filter"
version = "1.2.0"
engine = "lua"
description = "Hide or tag entries whose fields match, or fail to match, regular expressions"
license = "MIT"
homepage = "https://github.com/kernelmethod/kiki-rss"

# Entries matching an `exclude` rule are hidden. When an entry's feed has
# `include` rules, entries matching none of them are hidden too. Entries
# matching a `tag` rule get its tag. A rule's `feeds` names feeds by id, or
# by the URL they are fetched from. See main.lua for every setting.
#
# The rules are empty by default. Set them in the web UI or with, for
# example, `kiki plugin config set filter rules.toml`, where rules.toml
# holds:
#
#     [[exclude]]
#     fields = ["title"]
#     pattern = '\b(sponsored|webinar)\b'
#     flags = "i"
#
#     [[include]]
#     fields = ["categories"]
#     pattern = "rust"
#     feeds = [3, "https://example.com/feed.xml"]
#
#     [[tag]]
#     fields = ["title"]
#     pattern = '\bzero-day\b'
#     flags = "i"
#     tag = "urgent"
[config]
exclude = []
include = []
tag = []
rescan = true

[[settings]]
name = "exclude"
type = "list"
label = "Exclude rules"
description = "Entries matching any of these rules are hidden."

[settings.items]
type = "object"

[[settings.items.fields]]
name = "pattern"
type = "string"
required = true
label = "Pattern"
description = "A regular expression, in the syntax of kiki.regex."

[[settings.items.fields]]
name = "flags"
type = "string"
label = "Flags"
description = "kiki.regex flags, such as \"i\" for case-insensitive."

[[settings.items.fields]]
name = "fields"
type = "list"
items = { type = "choice", choices = ["title", "url", "content", "authors", "categories", "guid"] }
label = "Fields"
description = "The entry fields to match. None ticked means title and content."

[[settings.items.fields]]
name = "feeds"
type = "list"
items = { type = "integer", min = 1 }
label = "Feeds"
description = "Ids of the feeds the rule applies to. Leave empty for every feed."

[[settings]]
name = "include"
type = "list"
label = "Include rules"
description = "When an entry's feed has include rules, entries matching none of them are hidden."

[settings.items]
type = "object"

[[settings.items.fields]]
name = "pattern"
type = "string"
required = true
label = "Pattern"
description = "A regular expression, in the syntax of kiki.regex."

[[settings.items.fields]]
name = "flags"
type = "string"
label = "Flags"
description = "kiki.regex flags, such as \"i\" for case-insensitive."

[[settings.items.fields]]
name = "fields"
type = "list"
items = { type = "choice", choices = ["title", "url", "content", "authors", "categories", "guid"] }
label = "Fields"
description = "The entry fields to match. None ticked means title and content."

[[settings.items.fields]]
name = "feeds"
type = "list"
items = { type = "integer", min = 1 }
label = "Feeds"
description = "Ids of the feeds the rule applies to. Leave empty for every feed."

[[settings]]
name = "rescan"
type = "boolean"
label = "Rescan stored entries"
description = "Apply the rules to the entries already stored whenever they change."
