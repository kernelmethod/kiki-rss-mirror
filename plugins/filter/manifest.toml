name = "filter"
version = "3.1.0"
engine = "wasm"
entrypoint = "plugin.wasm"
description = "Hide entries whose fields match, or fail to match, regular expressions"
license = "MIT"
homepage = "https://github.com/kernelmethod/kiki-rss"

# Written in Rust, as a WebAssembly component: its source is beside this
# manifest in Kiki's repository. Versions before 3.1.0 were
# written in Lua, and took the same config.
#
# Entries matching an `exclude` rule are hidden. When an entry's feed has
# `include` rules, entries matching none of them are hidden too. A rule's
# `feeds` names feeds by id, or by the URL they are fetched from. See
# src/lib.rs for every setting. To tag entries, use the auto-tag plugin.
#
# The rules are empty by default. Set them in the web UI or with, for
# example, `kiki plugin config set filter rules.toml`, where rules.toml
# holds:
#
#     [[exclude]]
#     fields = ["title"]
#     pattern = '\b(sponsored|webinar)\b'
#     flags = "i"
#
#     [[include]]
#     fields = ["categories"]
#     pattern = "rust"
#     feeds = [3, "https://example.com/feed.xml"]
[config]
exclude = []
include = []
rescan = true

[[settings]]
name = "exclude"
type = "list"
label = "Exclude rules"
description = "Entries matching any of these rules are hidden."

[settings.items]
type = "object"

[[settings.items.fields]]
name = "pattern"
type = "string"
required = true
label = "Pattern"
description = "A regular expression, in the syntax of kiki.regex."

[[settings.items.fields]]
name = "flags"
type = "string"
label = "Flags"
description = "kiki.regex flags, such as \"i\" for case-insensitive."

[[settings.items.fields]]
name = "fields"
type = "list"
items = { type = "choice", choices = ["title", "url", "content", "authors", "categories", "guid"] }
label = "Fields"
description = "The entry fields to match. None ticked means title and content."

[[settings.items.fields]]
name = "feeds"
type = "list"
items = { type = "feed" }
label = "Feeds"
description = "The feeds the rule applies to, each by its id or the URL it is fetched from. Leave empty for every feed."

[[settings]]
name = "include"
type = "list"
label = "Include rules"
description = "When an entry's feed has include rules, entries matching none of them are hidden."

[settings.items]
type = "object"

[[settings.items.fields]]
name = "pattern"
type = "string"
required = true
label = "Pattern"
description = "A regular expression, in the syntax of kiki.regex."

[[settings.items.fields]]
name = "flags"
type = "string"
label = "Flags"
description = "kiki.regex flags, such as \"i\" for case-insensitive."

[[settings.items.fields]]
name = "fields"
type = "list"
items = { type = "choice", choices = ["title", "url", "content", "authors", "categories", "guid"] }
label = "Fields"
description = "The entry fields to match. None ticked means title and content."

[[settings.items.fields]]
name = "feeds"
type = "list"
items = { type = "feed" }
label = "Feeds"
description = "The feeds the rule applies to, each by its id or the URL it is fetched from. Leave empty for every feed."

[[settings]]
name = "rescan"
type = "boolean"
label = "Rescan stored entries"
description = "Apply the rules to the entries already stored whenever they change."
