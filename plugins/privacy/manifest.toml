name = "privacy"
version = "2.0.0"
engine = "wasm"
entrypoint = "plugin.wasm"
description = "Strip tracking parameters, such as utm_source, from the URLs in new entries, and tracking pixels from their content, and skip downloading images for chosen feeds"
license = "MIT"
homepage = "https://github.com/kernelmethod/kiki-rss"

# Written in Rust, as a WebAssembly component: its source is beside this
# manifest in Kiki's repository. Versions before 2.0.0 were written in Lua,
# and took the same config.

# Removes the query parameters named in `params` from each new entry's URL,
# and, unless `content` is false, from the links (href and src attributes)
# in its content. A name ending in `*` removes every parameter starting
# with the rest of it. Names are matched ignoring case. Unless `pixels` is
# false, it also removes tracking pixels from each new entry's content:
# images declared 1x1 or smaller, and images from the `trackers`. For the
# feeds in `skip_assets`, it keeps Kiki from downloading entries' images
# and enclosures at all. See src/lib.rs for the details.
#
# To strip more parameters, add them to the list, for example with
# `kiki plugin config get privacy --defaults`, editing its output and
# passing it to `kiki plugin config set privacy`.
[config]
params = [
    # Google Analytics campaigns, and Google Ads, Microsoft Ads, Meta,
    # Twitter/X, TikTok, LinkedIn, Instagram and Yandex click ids
    "utm_*",
    "gclid",
    "gclsrc",
    "dclid",
    "gbraid",
    "wbraid",
    "_ga",
    "_gl",
    "msclkid",
    "fbclid",
    "twclid",
    "ttclid",
    "li_fat_id",
    "igshid",
    "yclid",
    "_openstat",
    # Mailchimp, HubSpot, Marketo, Vero, Omeda, Rakuten, Adobe, Wicked Reports
    "mc_cid",
    "mc_eid",
    "_hsenc",
    "_hsmi",
    "__hssc",
    "__hstc",
    "__hsfp",
    "hsctatracking",
    "mkt_tok",
    "vero_id",
    "vero_conv",
    "oly_anon_id",
    "oly_enc_id",
    "rb_clickid",
    "s_cid",
    "wickedid",
    # Matomo and Piwik campaigns, and AT Internet
    "mtm_*",
    "matomo_*",
    "piwik_*",
    "pk_campaign",
    "pk_cid",
    "pk_content",
    "pk_keyword",
    "pk_kwd",
    "pk_medium",
    "pk_source",
    "xtor",
]
content = true
pixels = true
# Image sources whose images are removed from content: a host name
# (`*.` matches every subdomain too), optionally followed by the start of
# a path.
trackers = [
    "pixel.wp.com",                 # WordPress.com and Jetpack stats
    "stats.wordpress.com",
    "feeds.feedburner.com/~r/",     # FeedBurner
    "medium.com/_/stat",            # Medium
    "*.google-analytics.com",
    "*.doubleclick.net",
    "pixel.quantserve.com",         # Quantcast
    "*.scorecardresearch.com",      # Comscore
    "counter.theconversation.com",  # The Conversation's republishing counter
]
skip_assets = []

[[settings]]
name = "params"
type = "list"
items = { type = "string" }
label = "Parameters"
description = "The query parameters to remove, ignoring case. A name ending in * removes every parameter that starts with the rest of it."

[[settings]]
name = "content"
type = "boolean"
label = "Clean links in content"
description = "Also remove the parameters from the links (href and src attributes) in entries' content."

[[settings]]
name = "pixels"
type = "boolean"
label = "Remove tracking pixels"
description = "Remove images declared 1x1 or smaller, and images from the trackers below, from entries' content."

[[settings]]
name = "trackers"
type = "list"
items = { type = "string" }
label = "Trackers"
description = "Image sources whose images are removed from content: a host name (starting with *. to match its subdomains too), optionally followed by the start of a path, such as medium.com/_/stat."

[[settings]]
name = "skip_assets"
type = "list"
items = { type = "feed" }
label = "Feeds not to download images for"
description = "Kiki never downloads the images and enclosures of these feeds' entries into its asset cache, each feed given by its id or the URL it is fetched from."
