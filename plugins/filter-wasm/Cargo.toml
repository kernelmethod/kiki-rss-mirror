[package]
name = "kiki-filter"
version = "3.0.0"
edition = "2021"
publish = false
description = "The filter plugin, written in Rust as a WebAssembly component"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
kiki-plugin = { path = "../../sdk/rust/kiki-plugin" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Not part of kiki-rss's build; tools/build-filter-wasm.sh builds it.
[workspace]
