<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiki</title>
  <style>
    body { max-width: 48rem; margin: 0 auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    h1 .version { font-size: 0.875rem; font-weight: normal; color: #666; }
    .count { color: #666; }
    .entries { padding-left: 0; list-style: none; }
    .entries li { padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .entries time { display: block; font-size: 0.875rem; color: #666; }
    .pagination { margin: 1rem 0; text-align: center; }
  </style>
</head>
<body>
  <h1>Kiki <small class="version">v{{version}}</small></h1>
  {{content}}
</body>
</html>
