<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    body { max-width: 48rem; margin: 0 auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    h1 a { color: inherit; text-decoration: none; }
    h1 .version { font-size: 0.875rem; font-weight: normal; color: #666; }
    .site-nav { margin-top: -0.5rem; }
    .site-nav a { margin-right: 1rem; }
    .count { color: #666; }
    .list-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    .list-actions { display: flex; align-items: baseline; gap: 1rem; }
    .mark-read:disabled { cursor: progress; opacity: 0.5; }
    .filter { position: relative; }
    .filter summary { font-size: 1rem; }
    .filter .menu { position: absolute; right: 0; z-index: 1; margin-top: 0.25rem; padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 0.25rem; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); white-space: nowrap; }
    .filter label { cursor: pointer; }
    .entries { padding-left: 0; list-style: none; }
    .entries > li, .feeds > li { padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .feeds { padding-left: 0; list-style: none; }
    .plugins { padding-left: 0; list-style: none; }
    .plugins li { padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .plugins .description { margin: 0.25rem 0; }
    .plugin .error { padding: 0.5rem; border: 1px solid #c00; color: #900; }
    .plugin .notice { padding: 0.5rem; border: 1px solid #ca0; background: #fff8dd; }
    .config-form { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0.5rem 0; }
    .config-form input[type=text] { flex: 1 1 10rem; font-family: monospace; }
    .setting { padding: 0.5rem 0 0.75rem; border-bottom: 1px solid #ddd; }
    .setting h4 { margin: 0.25rem 0; }
    .setting h4 code { font-weight: normal; font-size: 0.875rem; color: #666; }
    .setting .description { margin: 0.25rem 0; }
    .setting-form { margin: 0.5rem 0; }
    .setting-form input[type=text], .setting-form input[type=number], .setting-form textarea, .setting-form select { box-sizing: border-box; max-width: 100%; font: inherit; }
    .setting-form input[type=text], .setting-form textarea { width: 100%; }
    .setting-form textarea, .setting-form .json { font-family: monospace; }
    .setting-form .buttons { display: flex; gap: 0.25rem; margin-top: 0.5rem; }
    .setting-form fieldset { margin: 0.5rem 0; border: 1px solid #ddd; }
    .setting-form .item.new { border-style: dashed; }
    .setting-form .field { margin: 0.5rem 0; }
    .setting-form .field > label { display: block; font-weight: 600; }
    .setting-form legend { font-weight: 600; }
    .setting-form .choices { display: flex; flex-wrap: wrap; gap: 0 1rem; border: none; padding: 0; margin: 0; }
    .setting-form .check { font-weight: normal; }
    .setting-form .remove { display: block; margin-top: 0.25rem; color: #900; }
    .hint { display: block; font-size: 0.875rem; color: #666; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    details.as-json, details.add-setting { margin: 0.25rem 0; }
    details summary { cursor: pointer; color: #666; font-size: 0.875rem; }
    .feed-header h2 { margin-bottom: 0.25rem; }
    .feed-header .description { margin: 0.5rem 0; }
    .meta { display: block; font-size: 0.875rem; color: #666; }
    .favicon { width: 1em; height: 1em; margin-right: 0.3em; vertical-align: -0.125em; }
    .pagination { margin: 1rem 0; text-align: center; }
    .entry h2 { margin-bottom: 0.25rem; }
    .entry .content { margin: 1rem 0; overflow-wrap: break-word; }
    .entry .content img { max-width: 100%; height: auto; }
    .entry .content pre { overflow-x: auto; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0.25rem 0 0; padding: 0; list-style: none; }
    .tags .tag { padding: 0 0.4rem; border: 1px solid #bbb; border-radius: 0.75rem; font-size: 0.75rem; color: #444; }
    .tags .tag.system { border-style: dashed; color: #666; background: #f4f4f4; }
    .entry .links { margin: 1rem 0; padding-top: 0.5rem; border-top: 1px solid #ddd; }
    .title-row { display: flex; align-items: baseline; gap: 0.5rem; }
    .save { padding: 0 0.25rem; border: none; background: none; color: #888; font-size: 1rem; line-height: 1; vertical-align: -0.125em; cursor: pointer; }
    .save:hover, .save:focus-visible { color: #444; }
    .save:disabled { cursor: progress; opacity: 0.5; }
    .save svg { width: 1em; height: 1em; }
    .save path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
    .save[aria-pressed=true] { color: #b8860b; }
    .save[aria-pressed=true] path { fill: currentColor; }
  </style>
</head>
<body>
  <h1><a href="/">Kiki</a> <small class="version">v{{version}}</small></h1>
  <nav class="site-nav"><a href="/">Entries</a><a href="/feeds">Feeds</a><a href="/plugins">Plugins</a></nav>
  {{content}}
  <script>{{script}}</script>
</body>
</html>
