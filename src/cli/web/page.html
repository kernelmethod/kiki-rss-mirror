<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    body { max-width: 48rem; margin: 0 auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    h1 a { color: inherit; text-decoration: none; }
    h1 .version { font-size: 0.875rem; font-weight: normal; color: #666; }
    .site-nav { margin-top: -0.5rem; }
    .site-nav a { margin-right: 1rem; }
    .count { color: #666; }
    .entries { padding-left: 0; list-style: none; }
    .entries li, .feeds li { padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .feeds { padding-left: 0; list-style: none; }
    .plugins { padding-left: 0; list-style: none; }
    .plugins li { padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    .plugins .description { margin: 0.25rem 0; }
    .plugin .error { padding: 0.5rem; border: 1px solid #c00; color: #900; }
    .plugin .notice { padding: 0.5rem; border: 1px solid #ca0; background: #fff8dd; }
    .config { width: 100%; border-collapse: collapse; }
    .config th, .config td { padding: 0.5rem 0.5rem 0.5rem 0; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    .config th { width: 1%; white-space: nowrap; }
    .config-form { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0.5rem 0; }
    .config-form input[type=text] { flex: 1 1 10rem; font-family: monospace; }
    .config-form textarea { flex: 1 1 100%; font-family: monospace; }
    .feed-header h2 { margin-bottom: 0.25rem; }
    .feed-header .description { margin: 0.5rem 0; }
    .meta { display: block; font-size: 0.875rem; color: #666; }
    .pagination { margin: 1rem 0; text-align: center; }
    .entry h2 { margin-bottom: 0.25rem; }
    .entry .content { margin: 1rem 0; overflow-wrap: break-word; }
    .entry .content img { max-width: 100%; height: auto; }
    .entry .content pre { overflow-x: auto; }
    .entry .links { margin: 1rem 0; padding-top: 0.5rem; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1><a href="/">Kiki</a> <small class="version">v{{version}}</small></h1>
  <nav class="site-nav"><a href="/">Entries</a><a href="/feeds">Feeds</a><a href="/plugins">Plugins</a></nav>
  {{content}}
</body>
</html>
