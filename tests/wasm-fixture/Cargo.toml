[package]
name = "kiki-wasm-fixture"
version = "0.1.0"
edition = "2021"
publish = false
description = "A WebAssembly plugin the tests of Kiki's WebAssembly engine run"

[lib]
crate-type = ["cdylib"]

[dependencies]
kiki-plugin = { path = "../../sdk/rust/kiki-plugin" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Not part of kiki-rss's build; tools/build-wasm-fixture.sh builds it.
[workspace]
