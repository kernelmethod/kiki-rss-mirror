[package]
name = "kiki-rss"
version = "0.2.0"
edition = "2021"
description = "An RSS feed aggregator"
license = "MIT"
repository = "https://github.com/kernelmethod/kiki-rss"
homepage = "https://github.com/kernelmethod/kiki-rss"

[[bin]]
name = "kiki"
path = "src/main.rs"

[features]
default = ["lua", "systemd"]
lua = ["mlua"]
systemd = []

[dependencies]
anyhow = "1.0"
atom_syndication = { version = "0.12", features = ["with-serde"] }
axum = { version = "0.8", features = ["macros"] }
chrono = "0.4"
dirs = "6"
clap = { version = "4.5", features = ["cargo", "derive"] }
quick-xml = { version = "0.37", features = ["serialize", "escape-html"] }
r2d2 = "0.8"
r2d2_sqlite = "0.27"
reqwest = { version = "0.13", features = ["json", "gzip", "deflate", "brotli", "zstd"] }
rss = "2.0"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
mlua = { version = "0.10", features = ["luajit", "vendored", "send"], optional = true }
thiserror = "2.0.18"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tokio = { version = ">=1.40,<1.45", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "^0.6.5", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"

[dev-dependencies]
flate2 = "1"
itertools = "0.14"
tempdir = "0.3"

[profile.release]
lto = "thin"

[package.metadata.deb]
maintainer = "kernelmethod"
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/kiki", "usr/bin/", "755"],
    ["dist/kiki.service", "usr/lib/systemd/system/", "644"],
    ["README.md", "usr/share/doc/kiki-rss/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/kiki", dest = "/usr/bin/kiki", mode = "755" },
    { source = "dist/kiki.service", dest = "/usr/lib/systemd/system/kiki.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kiki-rss/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
