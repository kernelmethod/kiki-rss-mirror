[package]
name = "kiki-rss"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
axum = { version = "0.8.1", features = ["macros"] }
clap = { version = "4.5.34", features = ["cargo", "derive"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.27.0"
reqwest = "0.12.15"
rss = "2.0.12"
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["serde_derive"] }
tokio = { version = ">=1.40,<1.45", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
itertools = "0.14.0"
tempdir = "0.3.7"
