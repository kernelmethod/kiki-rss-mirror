[package]
name = "kiki-rss"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["cargo", "derive"] }
r2d2 = "0.8"
r2d2_sqlite = "0.27"
reqwest = { git = "https://github.com/seanmonstar/reqwest", branch = "uds", features = ["json"] }
rss = "2.0"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["serde_derive"] }
thiserror = "2.0.18"
tokio = { version = ">=1.40,<1.45", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "^0.6.5", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
itertools = "0.14"
tempdir = "0.3"
