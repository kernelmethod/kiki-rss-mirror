[package]
name = "kiki-rss"
version = "0.15.2"
edition = "2021"
description = "An RSS feed aggregator"
license = "MIT"
repository = "https://github.com/kernelmethod/kiki-rss"
homepage = "https://github.com/kernelmethod/kiki-rss"

[lib]
name = "kiki_rss"
path = "src/lib.rs"

[[bin]]
name = "kiki"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "lua", "systemd", "api-docs", "metrics", "web-ui", "default-plugins"]
cli = ["clap"]
lua = ["mlua"]
systemd = []
api-docs = ["utoipa-scalar"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
web-ui = ["cli"]
# Bundle the plugins in plugins/ that `kiki init` installs (see build.rs)
default-plugins = ["dep:tar", "dep:zstd"]
extra-tests = []

[dependencies]
anyhow = "1.0"
async-channel = "2"
atom_syndication = { version = "0.12", features = ["with-serde"] }
axum = { version = "0.8", features = ["macros"] }
blake3 = "1"
chrono = "0.4"
dirs = "6"
lol_html = "2"
url = "2"
clap = { version = "4.5", features = ["cargo", "derive"], optional = true }
quick-xml = { version = "0.37", features = ["serialize", "escape-html"] }
r2d2 = "0.8"
r2d2_sqlite = "0.27"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "deflate", "brotli", "zstd", "rustls"] }
rss = "2.0"
rusqlite = { version = "0.34", features = ["bundled", "functions", "trace"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_bytes = "0.11"
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", default-features = false, optional = true }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"], optional = true }
regex = "1"
thiserror = "2.0.18"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"], optional = true }
tokio = { version = ">=1.40,<1.45", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "^0.6.5", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
toml = "1"
tar = { version = "0.4", default-features = false, optional = true }
zstd = { version = "0.14", default-features = false, optional = true }
arc-swap = "1"
notify = "8"

[build-dependencies]
tar = { version = "0.4", default-features = false, optional = true }
zstd = { version = "0.14", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

# musl's malloc is slow under contention, so musl builds use mimalloc instead.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
flate2 = "1"
http = "1"
itertools = "0.14"
serial_test = "3.4"
tempfile = "3"

[profile.dev]
incremental = true
opt-level = 2
debug = true

# Keep dependencies optimized, but build kiki-rss itself unoptimized: most of
# the generic code from tokio/serde/axum is monomorphized in this crate, and
# optimizing it roughly triples compile time without speeding up the tests.
[profile.dev.package.kiki-rss]
opt-level = 0

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
maintainer = "kernelmethod"
depends = "$auto"
section = "net"
priority = "optional"
maintainer-scripts = "dist/scripts"
assets = [
    ["target/release/kiki", "usr/bin/", "755"],
    ["dist/kiki.service", "usr/lib/systemd/system/", "644"],
    ["README.md", "usr/share/doc/kiki-rss/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/kiki", dest = "/usr/bin/kiki", mode = "755" },
    { source = "dist/kiki.service", dest = "/usr/lib/systemd/system/kiki.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kiki-rss/README.md", mode = "644", doc = true },
]

pre_install_script = """
# Create system group if it doesn't exist
getent group kiki >/dev/null 2>&1 || groupadd --system kiki
# Create system user if it doesn't exist
getent passwd kiki >/dev/null 2>&1 || \
    useradd --system --gid kiki --home-dir /var/lib/kiki \
        --shell /usr/sbin/nologin --no-create-home kiki
"""

post_install_script = """
# Create and set ownership on data directory
install -d -m 0750 -o kiki -g kiki /var/lib/kiki
# Initialize the database (idempotent)
su -s /bin/sh kiki -c 'KIKI_HOME=/var/lib/kiki /usr/bin/kiki init --check'
# Reload systemd and enable service
systemctl daemon-reload
"""

pre_uninstall_script = """
# Stop and disable service before removal
systemctl is-active --quiet kiki.service 2>/dev/null && systemctl stop kiki.service
systemctl is-enabled --quiet kiki.service 2>/dev/null && systemctl disable kiki.service
true
"""

[package.metadata.generate-rpm.requires]
systemd = "*"
