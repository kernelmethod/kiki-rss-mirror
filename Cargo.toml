[package]
name = "kiki-rss"
version = "0.36.0"
edition = "2021"
description = "An RSS feed aggregator"
license = "MIT"
repository = "https://github.com/kernelmethod/kiki-rss"
homepage = "https://github.com/kernelmethod/kiki-rss"

[lib]
name = "kiki_rss"
path = "src/lib.rs"

[[bin]]
name = "kiki"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "systemd", "api-docs", "metrics", "web-ui", "default-plugins"]
cli = ["clap"]
systemd = []
api-docs = ["utoipa-scalar"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
web-ui = ["cli"]
# Bundle the plugins in plugins/ that `kiki init` installs (see build.rs).
default-plugins = ["dep:tar", "dep:zstd"]
extra-tests = []

[dependencies]
anyhow = "1.0"
async-channel = "2"
atom_syndication = { version = "0.12", features = ["with-serde"] }
axum = { version = "0.8", features = ["macros"] }
blake3 = "1"
chrono = "0.4"
dirs = "6"
lol_html = "2"
url = "2"
clap = { version = "4.5", features = ["cargo", "derive"], optional = true }
quick-xml = { version = "0.37", features = ["serialize", "escape-html"] }
r2d2 = "0.8"
r2d2_sqlite = "0.27"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "deflate", "brotli", "zstd", "rustls", "socks"] }
rss = "2.0"
rusqlite = { version = "0.34", features = ["bundled", "functions", "trace"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_bytes = "0.11"
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", default-features = false, optional = true }
regex = "1"
thiserror = "2.0.18"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"], optional = true }
tokio = { version = ">=1.40,<1.45", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "^0.6.5", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
toml = "1"
tar = { version = "0.4", default-features = false, optional = true }
zstd = { version = "0.14", default-features = false, optional = true }
arc-swap = "1"
notify = "8"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
subtle = "2"
wasmtime = { version = "45", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "addr2line", "demangle"] }
wit-component = { version = "0.248", default-features = false }

[build-dependencies]
tar = { version = "0.4", default-features = false, optional = true }
zstd = { version = "0.14", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
wat = "1"
flate2 = "1"
http = "1"
itertools = "0.14"
serial_test = "3.4"
tempfile = "3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.dev]
incremental = true
opt-level = 2
debug = true

# Keep dependencies optimized, but build kiki-rss itself unoptimized: most of
# the generic code from tokio/serde/axum is monomorphized in this crate, and
# optimizing it roughly triples compile time without speeding up the tests.
[profile.dev.package.kiki-rss]
opt-level = 0

[profile.release]
# Fat LTO with a single codegen unit cuts the binary by about 14% compared
# with thin LTO, at the cost of a slower release build.
lto = "fat"
codegen-units = 1
strip = true

# A release build that profilers can read: the same optimizations, but with
# symbols and line tables kept, so `perf report` and flamegraphs show kiki's
# functions rather than bare addresses. Build it with
# `cargo build --profile profiling`; the binary lands in target/profiling/.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[[bench]]
name = "sanitize"
harness = false
# The plugin is built only for the default plugins.
required-features = ["default-plugins"]
