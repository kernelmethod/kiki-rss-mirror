name = "hide-matching"
version = "1.0.0"
engine = "wasm"
description = "Hide entries whose title or content matches a regular expression"
entrypoint = "plugin.wasm"

[config]
rules = []

[[settings]]
name = "rules"
type = "list"
label = "Rules"
description = "Entries matching any rule are hidden."

[settings.items]
type = "object"

[[settings.items.fields]]
name = "pattern"
type = "string"
label = "Pattern"
required = true

[[settings.items.fields]]
name = "field"
type = "choice"
label = "Field"
choices = ["title", "content"]
